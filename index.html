<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon premier site</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .card {
      width: min(560px, 100%);
      padding: 48px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 8vw, 3.5rem);
    }

    p {
      margin: 0 0 28px;
      font-size: 1.15rem;
      line-height: 1.6;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      color: #1d4ed8;
      background: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mon premier site</h1>
    <p>Bonjour, je m'appelle Adil. Voici ma première page internet créée avec GitHub et ChatGPT.</p>
    <button type="button" onclick="direBonjour()">Clique ici</button>
  </main>

  <script>
    function direBonjour() {
      alert("Bravo Adil ! Ton premier site fonctionne.");
    }
  </script>
</body>
</html>
