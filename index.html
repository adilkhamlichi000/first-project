<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>My first website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .card {
      width: min(560px, 100%);
      padding: 48px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 8vw, 3.5rem);
    }

    p {
      margin: 0 0 28px;
      font-size: 1.15rem;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      color: #1d4ed8;
      background: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>My first website created by AI</h1>
    <p>For my three kbidates diali: Kenza, Kams et Lilya! ❤️</p>
    <p><strong>@Kamélia</strong>, on va créer pas mal de choses avec l’IA les deux prochaines semaines.</p>
    <p><strong>@Lilya</strong>, on va faire beaucoup de dessins pour maman.</p>
    <div class="buttons">
      <button type="button" onclick="afficherMessage('kenza')">Kenza</button>
      <button type="button" onclick="afficherMessage('kamelia')">Kamélia</button>
      <button type="button" onclick="afficherMessage('lilya')">Lilya</button>
    </div>
  </main>

  <script>
    function afficherMessage(personne) {
      const messages = {
        kenza: "Kenza ❤️ Merci d’être une maman extraordinaire !",
        kamelia: "Kamélia ✨ On va créer plein de choses avec l’IA !",
        lilya: "Lilya 🎨 On va faire beaucoup de dessins pour maman !"
      };

      alert(messages[personne]);
    }
  </script>
</body>
</html>
